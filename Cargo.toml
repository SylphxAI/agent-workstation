[package]
name = "agent-workstation"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "One headless Wayland desktop per agent session: a single headful browser, web and desktop operations on one state, and a full-desktop noVNC takeover"
repository = "https://github.com/SylphxAI/agent-workstation"
readme = "README.md"
keywords = ["agent", "browser", "wayland", "automation", "vnc"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]
include = ["/src/**", "/assets/**", "/tests/**", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[workspace]
# `bench/` is an independent tree; it may depend on this crate by path.
exclude = ["bench"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
url = "2"
png = "0.18"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "fs", "pipe"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
