name: release

# Deliberate releases only. Configure the crates.io trusted publisher first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo.toml version to publish from main
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    environment: crates-io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Check requested release
        id: check
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-check.sh
      - name: Authenticate to crates.io
        if: steps.check.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Tag
        if: steps.check.outputs.publish == 'true'
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
