name: ci

# Format, clippy, docs, unit tests and a headful integration test on a
# headless Wayland desktop (sway + wayvnc + Chrome).
#
# GitHub-hosted standard runners are free only on a public repository, so
# every job carries `github.event.repository.private == false`: a private copy
# of this repository runs no hosted minute. `runs-on` names hosted labels only,
# so fork pull requests never reach a self-hosted runner.
#
# `ci-ok` is the one required check; it runs no repository code.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  lint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release preflight tests
        run: python3 -m unittest discover -s .github/tests -v
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Desktop packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends sway wayvnc fonts-dejavu-core
      - name: Unit and behaviour tests
        run: cargo test --all-features --locked
      - name: Headful integration (headless Wayland + Chrome + wayvnc)
        env:
          AGENT_WORKSTATION_HEADFUL: '1'
          AGENT_WORKSTATION_BROWSER: /usr/bin/google-chrome
        run: cargo test --all-features --locked --tests -- --nocapture --test-threads=1

  macos:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check portable library
        run: cargo check --lib --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and unsupported-platform tests
        run: cargo test --all-features --locked

  ci-ok:
    if: always() && github.event.repository.private == false
    needs: [lint, test, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
