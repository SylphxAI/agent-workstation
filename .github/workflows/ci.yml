name: ci

# Format, clippy, docs, unit tests and a headful integration test on a
# headless Wayland desktop (sway + wayvnc + Chrome).
#
# Use standard hosted runners only for affirmatively public repositories.
# Non-public fork pull-request workflows must remain disabled in repository policy.
#
# `ci-ok` is the one required check; it runs no repository code.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    if: github.event.repository.visibility == 'public' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    uses: SylphxAI/.github/.github/workflows/changes.yml@6e0fab5388f5ae44afdd17abb2ec6c9b26f80b0e
    with:
      runner: ubuntu-latest

  shared-baseline:
    needs: changes
    if: github.event.repository.visibility == 'public' || needs.changes.outputs.migrations != 'false'
    uses: SylphxAI/.github/.github/workflows/shared-baseline-check.yml@6e0fab5388f5ae44afdd17abb2ec6c9b26f80b0e
    with:
      migrations: ${{ needs.changes.outputs.migrations }}

  lint:
    if: github.event.repository.visibility == 'public' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release preflight tests
        run: python3 -m unittest discover -s .github/tests -v
      - name: Takeover JavaScript
        run: |
          node --input-type=module --check < assets/takeover/app.js
          node --test tests/takeover-input.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  test:
    if: github.event.repository.visibility == 'public' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || github.event_name == 'merge_group' && 'sylphx-linux-standard-merge' || 'sylphx-linux-standard' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Desktop packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends sway wayvnc fonts-dejavu-core dbus at-spi2-core python3-gi gir1.2-gtk-3.0
          if [ ! -x /usr/bin/google-chrome ]; then
            chrome_deb="$RUNNER_TEMP/google-chrome-stable.deb"
            curl --fail --silent --show-error --location --retry 3 \
              --output "$chrome_deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -yq --no-install-recommends "$chrome_deb"
          fi
          test -x /usr/bin/google-chrome
      - name: Unit and behaviour tests
        run: cargo test --all-features --locked
      - name: WebMCP integration (headless Chromium)
        env:
          AGENT_WORKSTATION_WEBMCP_BROWSER: /usr/bin/google-chrome
          AGENT_WORKSTATION_WEBMCP_NO_SANDBOX: '1'
        run: cargo test --all-features --locked --test webmcp -- --nocapture
      - name: WebAuthn integration (headless Chromium)
        env:
          AGENT_WORKSTATION_WEBAUTHN_BROWSER: /usr/bin/google-chrome
          AGENT_WORKSTATION_WEBAUTHN_NO_SANDBOX: '1'
        run: cargo test --all-features --locked --test webauthn -- --nocapture
      - name: Headful integration (headless Wayland + Chrome + wayvnc)
        env:
          AGENT_WORKSTATION_HEADFUL: '1'
          AGENT_WORKSTATION_BROWSER: /usr/bin/google-chrome
        run: cargo test --all-features --locked --tests -- --nocapture --test-threads=1

  macos:
    if: github.event.repository.visibility == 'public' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"macos-latest"' || '["self-hosted","sylphx","macos","standard"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check portable library
        run: cargo check --lib --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and unsupported-platform tests
        run: cargo test --all-features --locked

  windows:
    if: github.event.repository.visibility == 'public' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"windows-latest"' || '["self-hosted","sylphx","windows","standard"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check portable library
        run: cargo check --lib --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and native adapter tests
        run: cargo test --all-features --locked

  ci-ok:
    if: always()
    needs: [changes, lint, test, macos, windows, shared-baseline]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ format('{0} {1} {2} {3} {4}', needs.changes.result, needs.lint.result, needs.test.result, needs.macos.result, needs.windows.result) }}
          BASELINE_RESULT: ${{ needs.shared-baseline.result }}
          BASELINE_MAY_SKIP: ${{ github.event.repository.visibility != 'public' && needs.changes.outputs.migrations == 'false' }}
        run: |
          echo "results: $RESULTS"
          [ "$RESULTS" = "success success success success success" ] || {
            echo "a required job did not succeed"
            exit 1
          }
          case "$BASELINE_MAY_SKIP:$BASELINE_RESULT" in
            true:skipped|true:success|false:success) ;;
            *) echo "shared-baseline did not succeed: $BASELINE_RESULT"; exit 1 ;;
          esac
