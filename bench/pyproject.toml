[project]
name = "wsbench"
version = "0.1.0"
description = "Bot-detection benchmark for headful browser engines on a virtual desktop"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "websockets>=13",
  "pillow>=10",
  "camoufox[geoip]>=0.5.9",
]

[project.scripts]
wsbench-run = "wsbench.run:main"
wsbench-report = "wsbench.report:main"
wsbench-integration = "wsbench.integration:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wsbench"]

[tool.setuptools.package-data]
wsbench = ["*.js"]
